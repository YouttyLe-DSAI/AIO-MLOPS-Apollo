seed: 42
model: resnet18
data_root: data
output_dir: artifacts/resnet18_cifar10_rtx4090_seed42
epochs: 100
batch_size: 128
eval_batch_size: 128
workers: 4
threads: 4
lr: 0.1
momentum: 0.9
weight_decay: 0.0005
val_per_class: 500
calibration_per_class: 100
device: cuda
target_gpu: NVIDIA GeForce RTX 4090
target_vram_gib: 24
# PyTorch allocator budget on both H100 and RTX 4090; not total process VRAM.
cuda_memory_budget_gib: 16
deterministic: true
experiment: cifar10-baseline
