name: Baseline contract
on:
  push:
    branches: [main]
    paths: ['src/baseline/**', 'tests/**', 'scripts/import_mlflow.py', 'requirements-training.txt', '.github/workflows/baseline-tests.yaml']
  pull_request:
    paths: ['src/baseline/**', 'tests/**', 'scripts/import_mlflow.py', 'requirements-training.txt', '.github/workflows/baseline-tests.yaml']
permissions:
  contents: read
jobs:
  baseline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install CPU training environment
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-training.txt
      - name: Verify data, model, resume and handoff contracts
        run: python -m pytest -q tests
