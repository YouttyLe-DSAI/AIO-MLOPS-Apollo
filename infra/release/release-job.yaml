# One release = one Job on the L4 node (rendered by run_release.sh; ${...} are substituted there).
#   fetch-model  (CPU)  MLflow registry -> /work/mv/model.onnx + meta.json        fetch_model.py
#   build-engine (GPU)  TensorRT 26.09 trtexec -> Triton model repository         build_engine.py
#   ecr-login    (CPU)  ECR credentials for BuildKit
#   build-image  (CPU)  BuildKit rootless: Serving image -> ECR, tag = Model version
# AWS access (ECR push, ECR describe) comes from EKS Pod Identity on ServiceAccount release-builder.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: release
    app.kubernetes.io/part-of: apollo
  annotations:
    apollo/registered-model: "${MODEL_NAME}"
    apollo/model-version: "${MODEL_VERSION}"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release
    spec:
      serviceAccountName: release-builder
      restartPolicy: Never
      nodeSelector:
        role: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 60Gi
        - name: scripts
          configMap:
            name: release-scripts
        - name: docker-config
          emptyDir: {}
        - name: buildkit
          emptyDir: {}
      initContainers:
        - name: fetch-model
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install -q --no-cache-dir --disable-pip-version-check "mlflow-skinny==3.16.0" boto3 pyyaml
              && python /scripts/fetch_model.py
          env:
            - { name: MODEL_NAME, value: "${MODEL_NAME}" }
            - { name: MODEL_VERSION, value: "${MODEL_VERSION}" }
            - { name: ECR_REPOSITORY_URI, value: "${ECR_REPOSITORY_URI}" }
            - { name: AWS_REGION, value: "${AWS_REGION}" }
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow.mlflow.svc.cluster.local" }
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom: { secretKeyRef: { name: mlflow-release-bot, key: username } }
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-release-bot, key: password } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: scripts, mountPath: /scripts }
        - name: build-engine
          image: nvcr.io/nvidia/tensorrt:26.09-py3
          command: ["python3", "/scripts/build_engine.py"]
          resources:
            requests: { cpu: "2", memory: 6Gi }
            limits: { nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: scripts, mountPath: /scripts }
        - name: ecr-login
          image: amazon/aws-cli:2.40.4
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              [ -f /work/SKIP ] && exit 0
              REGISTRY="${ECR_REPOSITORY_URI%%/*}"
              PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
              AUTH="$(printf 'AWS:%s' "$PASSWORD" | base64 -w0)"
              printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$AUTH" > /docker/config.json
              chmod 644 /docker/config.json
          env:
            - { name: ECR_REPOSITORY_URI, value: "${ECR_REPOSITORY_URI}" }
            - { name: AWS_REGION, value: "${AWS_REGION}" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: docker-config, mountPath: /docker }
      containers:
        - name: build-image
          image: moby/buildkit:v0.35.0-rootless
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              IMAGE="$(cat /work/IMAGE)"
              if [ ! -f /work/SKIP ]; then
                buildctl-daemonless.sh build \
                  --frontend dockerfile.v0 \
                  --local context=/work/repo --local dockerfile=/work/repo \
                  --output "type=image,name=${IMAGE},push=true"
              fi
              echo "RELEASED_IMAGE=${IMAGE}"
          env:
            - { name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox" }
            - { name: DOCKER_CONFIG, value: /home/user/.docker }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: Unconfined }
            appArmorProfile: { type: Unconfined }
          resources:
            requests: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: docker-config, mountPath: /home/user/.docker }
            - { name: buildkit, mountPath: /home/user/.local/share/buildkit }
